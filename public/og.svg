<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#0f0a1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow blobs -->
  <circle cx="200" cy="150" r="300" fill="#7c3aed" opacity="0.08" filter="url(#blur)"/>
  <circle cx="1050" cy="500" r="250" fill="#4ade80" opacity="0.05" filter="url(#blur)"/>

  <!-- Grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Logo badge -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="#141414" stroke="#222222" stroke-width="1"/>
  <text x="112" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-2">m</text>

  <!-- Wordmark -->
  <text x="80" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="96" font-weight="800" fill="white" letter-spacing="-6">m-ops</text>

  <!-- Tagline -->
  <text x="80" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="400" fill="#666666" letter-spacing="-0.5">Full-stack developer ops. Monitor. Debug. Ship.</text>

  <!-- Feature pills -->
  <rect x="80" y="360" width="160" height="38" rx="10" fill="#1a0f2e" stroke="#2d1a5e" stroke-width="1"/>
  <text x="160" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#a78bfa" text-anchor="middle">AI debugging</text>

  <rect x="256" y="360" width="150" height="38" rx="10" fill="#051a10" stroke="#0a3020" stroke-width="1"/>
  <text x="331" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#4ade80" text-anchor="middle">Uptime checks</text>

  <rect x="422" y="360" width="130" height="38" rx="10" fill="#0a1220" stroke="#1a2a40" stroke-width="1"/>
  <text x="487" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#60a5fa" text-anchor="middle">SLA reports</text>

  <rect x="568" y="360" width="170" height="38" rx="10" fill="#1a1200" stroke="#3a2a00" stroke-width="1"/>
  <text x="653" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#fbbf24" text-anchor="middle">Code insights</text>

  <rect x="754" y="360" width="150" height="38" rx="10" fill="#1a0a0a" stroke="#3a1a1a" stroke-width="1"/>
  <text x="829" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#f87171" text-anchor="middle">Slack alerts</text>

  <!-- Bottom URL -->
  <text x="80" y="570" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="600" fill="#333333" letter-spacing="0">m-ops.pro</text>

  <!-- Right side — fake uptime sparkline -->
  <g transform="translate(850, 160)">
    <rect width="280" height="160" rx="14" fill="#111111" stroke="#1a1a1a" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#333">UPTIME · 30 DAYS</text>
    <text x="20" y="55" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="800" fill="#4ade80">99.98%</text>
    <!-- Sparkline bars -->
    <rect x="20" y="90" width="6" height="50" rx="2" fill="#0a3020"/>
    <rect x="30" y="85" width="6" height="55" rx="2" fill="#0a3020"/>
    <rect x="40" y="80" width="6" height="60" rx="2" fill="#0a3020"/>
    <rect x="50" y="88" width="6" height="52" rx="2" fill="#0a3020"/>
    <rect x="60" y="75" width="6" height="65" rx="2" fill="#0a3020"/>
    <rect x="70" y="82" width="6" height="58" rx="2" fill="#0a3020"/>
    <rect x="80" y="78" width="6" height="62" rx="2" fill="#0a3020"/>
    <rect x="90" y="110" width="6" height="30" rx="2" fill="#3a1a1a"/>
    <rect x="100" y="80" width="6" height="60" rx="2" fill="#0a3020"/>
    <rect x="110" y="76" width="6" height="64" rx="2" fill="#0a3020"/>
    <rect x="120" y="84" width="6" height="56" rx="2" fill="#0a3020"/>
    <rect x="130" y="79" width="6" height="61" rx="2" fill="#0a3020"/>
    <rect x="140" y="83" width="6" height="57" rx="2" fill="#0a3020"/>
    <rect x="150" y="77" width="6" height="63" rx="2" fill="#0a3020"/>
    <rect x="160" y="81" width="6" height="59" rx="2" fill="#0a3020"/>
    <rect x="170" y="86" width="6" height="54" rx="2" fill="#0a3020"/>
    <rect x="180" y="74" width="6" height="66" rx="2" fill="#0a3020"/>
    <rect x="190" y="80" width="6" height="60" rx="2" fill="#0a3020"/>
    <rect x="200" y="76" width="6" height="64" rx="2" fill="#0a3020"/>
    <rect x="210" y="72" width="6" height="68" rx="2" fill="#0a3020"/>
    <rect x="220" y="79" width="6" height="61" rx="2" fill="#4ade80" opacity="0.6"/>
    <rect x="230" y="75" width="6" height="65" rx="2" fill="#4ade80" opacity="0.8"/>
    <rect x="240" y="71" width="6" height="69" rx="2" fill="#4ade80"/>
  </g>

  <!-- Right bottom card -->
  <g transform="translate(850, 340)">
    <rect width="280" height="100" rx="14" fill="#111111" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="26" cy="30" r="8" fill="#051a10" stroke="#0a3020" stroke-width="1"/>
    <circle cx="26" cy="30" r="4" fill="#4ade80"/>
    <text x="44" y="35" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">api.myapp.com</text>
    <text x="44" y="52" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#444">124ms · 200 OK</text>
    <circle cx="26" cy="75" r="8" fill="#051a10" stroke="#0a3020" stroke-width="1"/>
    <circle cx="26" cy="75" r="4" fill="#4ade80"/>
    <text x="44" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">dashboard.myapp.com</text>
  </g>
</svg>
